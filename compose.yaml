
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/app/credentials.env
    environment:
      DATABASE_URL: /app/spv.db
    volumes:
      - ./backend/spv.db:/app/spv.db
    networks:
      - interna

  frontend:
    build: ./frontend/app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - interna

networks:
  interna:
